# USD per MILLION tokens. Source: third-party write-ups (PPC Land, Apidog) supplied by the user, NOT yet confirmed on Anthropic's pricing page.
# Haiku has two tiers by prompt size; the over-100K row is used so the budget guard is conservative. cache_write = 5-minute ephemeral write (what the adapter uses).
models:
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_write: 2.50, cache_read: 0.20}
  claude-haiku-5-5:  {input: 0.50, output: 2.50, cache_write: 0.625, cache_read: 0.05}
