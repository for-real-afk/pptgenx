[project]
name = "deckgen"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6", "typer>=0.12", "python-pptx>=1.0", "pillow", "defusedxml", "lxml",
  "anthropic>=0.40", "langgraph>=0.2", "httpx", "python-dotenv", "pyyaml",
]
[project.optional-dependencies]
dev = ["pytest", "ruff"]
[project.scripts]
deckgen = "deckgen.cli:app"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 160
target-version = "py311"
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET"]
ignore = ["E501", "B008", "SIM108", "RET504", "RET505", "B905"]
